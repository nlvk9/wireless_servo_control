; PlatformIO project configuration
; Documentation: https://docs.platformio.org/en/latest/projectconf/

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino

; Serial monitor baud rate (must match Serial.begin() in firmware)
monitor_speed = 115200

; Additional libraries required by this firmware target
lib_deps =
    madhephaestus/ESP32Servo @ ^0.13.0

; Include the shared headers using an absolute project-relative path
build_flags =
    -I${PROJECT_DIR}/../../shared
